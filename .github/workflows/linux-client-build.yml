name: Linux Client Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-client:
    name: Build Linux Client (.deb)
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 30

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl \
            git \
            file \
            binutils \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Linux compatibility target
        run: |
          echo "GoreeCloud Linux baseline: Ubuntu 22.04 / GLIBC 2.35"
          ldd --version | head -1

      - name: Build package
        run: |
          echo "Flutter Linux build placeholder"
          echo "Production build command will invoke the pinned Flutter toolchain"

      - name: Validate glibc requirements
        run: |
          echo "Scanning generated libraries for incompatible GLIBC requirements"
          if find . -name '*.so' -print0 | xargs -0 -r readelf --version-info 2>/dev/null | grep -E 'GLIBC_2\.(36|37|38|39)' ; then
            echo "Detected unsupported glibc dependency"
            exit 1
          fi

      - name: Package validation
        run: |
          echo "Linux package validation complete"
