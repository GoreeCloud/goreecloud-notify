name: Bootstrap browser test lock

on:
  push:
    branches:
      - agent/milestone-3-browser-accessibility

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/milestone-3-browser-accessibility
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve browser test dependencies into the lock
        working-directory: frontend
        run: >-
          npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund
          @playwright/test@latest @axe-core/playwright@latest
      - name: Commit locked dependency update
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No lock update required."
            exit 0
          fi
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "Lock browser accessibility test dependencies"
          git push origin HEAD:agent/milestone-3-browser-accessibility
