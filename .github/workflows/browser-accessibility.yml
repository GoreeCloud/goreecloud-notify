name: Browser accessibility

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-accessibility.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/browser-accessibility.yml'

permissions:
  contents: read

jobs:
  chromium-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium browser and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build immutable frontend artifact
        working-directory: frontend
        run: npm run build
      - name: Run browser and accessibility validation
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:browser
