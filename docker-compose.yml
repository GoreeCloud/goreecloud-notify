name: goreecloud-notify

services:
  backend:
    build:
      context: ./backend
    container_name: goreecloud-notify-backend
    restart: unless-stopped
    environment:
      GOREECLOUD_NOTIFY_DATABASE_URL: sqlite:////data/goreecloud_notify.db
      GOREECLOUD_NOTIFY_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      GOREECLOUD_NOTIFY_ADMIN_TOKEN: ${GOREECLOUD_NOTIFY_ADMIN_TOKEN:-}
      GOREECLOUD_NOTIFY_SESSION_COOKIE_SECURE: "false"
      GOREECLOUD_NOTIFY_SESSION_LIFETIME_MINUTES: "720"
      GOREECLOUD_NOTIFY_SESSION_IDLE_MINUTES: "60"
      GOREECLOUD_NOTIFY_SESSION_TOUCH_MINUTES: "5"
    volumes:
      - ./backend/data:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: goreecloud-notify-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
